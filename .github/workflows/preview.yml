name: Review a bilingual copy proposal
on:
  workflow_dispatch:
    inputs:
      proposal:
        description: Single JSON proposal from the coding agent
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the trusted rules
        run: python3 -m unittest -v
      - name: Validate the proposal and render the preview
        env:
          PROPOSAL: ${{ inputs.proposal }}
        run: |
          printf '%s' "$PROPOSAL" > "$RUNNER_TEMP/proposal.json"
          python3 workflow.py preview "$RUNNER_TEMP/proposal.json" "$RUNNER_TEMP/staging"
      - name: Attach preview and review receipt
        uses: actions/upload-artifact@v7
        with:
          name: staging-copy-preview
          path: ${{ runner.temp }}/staging/
          if-no-files-found: error
          retention-days: 7
